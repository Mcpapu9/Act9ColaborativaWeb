<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vía Segura - Inicio</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <!-- Header institucional -->
  <header>
    <div style="display: flex; align-items: center; gap: 10px;">
      <span style="font-weight: bold; font-size: 1.1rem;">Vía Segura</span>
    </div>
    <a href="index.html" class="link-text" style="color: white; margin: 0;">Cerrar Sesión</a>
  </header>

  <!-- Contenido principal centrado -->
  <div class="container-center">
    <div class="card card-wide">

      <div class="logo-container">
        <img src="img/viasegura.png" alt="Logo Vía Segura" class="logo-img">
      </div>

      <h2>Bienvenido a Vía Segura</h2>
      <p style="text-align: center; color: var(--text-muted); margin-bottom: 25px;">
        Consulta, reporta y previene riesgos comunitarios
      </p>

      <div style="display: flex; justify-content: center;">
        <a href="reportar.html" class="menu-card" style="width: 100%; max-width: 380px; padding: 30px;">
          <img src="img/phone-icon.png" alt="Icono de reporte" style="width: 56px; height: 56px; margin-bottom: 12px;">
          <h3 style="font-size: 1.2rem; color: var(--primary); margin-bottom: 8px;">Reportar Incidente</h3>
          <p style="font-size: 0.9rem; color: var(--text-muted);">Genera un reporte de riesgo o emergencia de forma rápida y obtiene tu folio.</p>
        </a>
      </div>
      

    </div>
  </div>

</body>
</html>
